<!DOCTYPE html>
<html lang="en" class="antialiased text-slate-200 bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentFlow Engine | Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb',
                            purple: '#8b5cf6',
                            pink: '#ec4899'
                        }
                    },
                    animation: {
                        'gradient-x': 'gradient-x 3s ease infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            },
                        },
                        'float': {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for premium feel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden selection:bg-brand-purple selection:text-white flex flex-col">

    <!-- Animated Background Gradients -->
    <div class="absolute top-0 -left-40 w-96 h-96 bg-brand-purple rounded-full mix-blend-multiply filter blur-[128px] opacity-20 animate-float"></div>
    <div class="absolute top-40 -right-40 w-96 h-96 bg-brand-500 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 animate-float" style="animation-delay: 2s;"></div>

    <main class="relative z-10 container mx-auto px-6 py-12 max-w-6xl flex-grow flex flex-col">
        <!-- Header -->
        <header class="text-center mb-16 space-y-4">
            <div class="inline-block p-1 rounded-full bg-gradient-to-r from-brand-500 via-brand-purple to-brand-pink mb-4">
                <div class="px-4 py-1 rounded-full bg-slate-900 text-xs font-semibold uppercase tracking-widest text-slate-300">
                    Enterprise Edition
                </div>
            </div>
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight">
                AgentFlow <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 via-brand-purple to-brand-pink animate-gradient-x">Engine</span>
            </h1>
            <p class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto font-light">
                Orchestrate intelligent background agents with seamless asynchronous processing.
            </p>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 flex-grow">
            
            <!-- Controls (Left) -->
            <div class="lg:col-span-5 flex flex-col gap-6">
                <div class="glass-panel rounded-2xl p-8 shadow-2xl transition duration-300 hover:border-slate-600/50 relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-500 to-brand-purple opacity-50 group-hover:opacity-100 transition-opacity"></div>
                    <h2 class="text-2xl font-semibold mb-6 flex items-center gap-3">
                        <svg class="w-6 h-6 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Deploy New Agent
                    </h2>
                    
                    <div class="space-y-5">
                        <div>
                            <label for="persona" class="block text-sm font-medium text-slate-400 mb-2">Select Agent Persona</label>
                            <select id="persona" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-4 text-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-purple/50 focus:border-brand-purple mb-4">
                                <option value="general">Default: General Assistant</option>
                                <option value="code_sensei">👨‍💻 Code Sensei (Code Explainer & Formatter)</option>
                                <option value="resume_roaster">🔥 Resume Roaster (Brutal Resume Reviewer)</option>
                            </select>
                            
                            <label for="prompt" class="block text-sm font-medium text-slate-400 mb-2">Instructions / Prompt</label>
                            <textarea id="prompt" rows="5" 
                                class="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-4 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-purple/50 focus:border-brand-purple transition-all resize-none"
                                placeholder="E.g. Paste your code or resume here..."></textarea>
                        </div>
                        
                        <button id="submitBtn" onclick="submitTask()" 
                            class="w-full relative inline-flex items-center justify-center px-8 py-4 font-bold text-white transition-all duration-200 bg-slate-900 border border-transparent rounded-xl focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 hover:bg-slate-800 hover:shadow-[0_0_20px_rgba(139,92,246,0.3)] overflow-hidden group">
                            <span class="absolute inset-0 w-full h-full -mt-1 rounded-lg opacity-30 bg-gradient-to-b from-transparent via-transparent to-black"></span>
                            <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-brand-500 to-brand-purple opacity-90 group-hover:opacity-100 transition-opacity"></span>
                            <span class="relative flex items-center gap-2">
                                Execute Workflow
                                <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </span>
                        </button>
                    </div>
                </div>

                <!-- Stats Panel (Visual flair) -->
                <div class="glass-panel rounded-2xl p-6 shadow-xl grid grid-cols-2 gap-4 text-center">
                    <div>
                        <div class="text-slate-400 text-sm font-medium mb-1">System Status</div>
                        <div class="text-emerald-400 font-bold flex items-center justify-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online
                        </div>
                    </div>
                    <div>
                        <div class="text-slate-400 text-sm font-medium mb-1">Workers</div>
                        <div class="text-slate-200 font-bold">1 Idle</div>
                    </div>
                </div>
            </div>

            <!-- Task Board (Right) -->
            <div class="lg:col-span-7">
                <div class="glass-panel rounded-2xl p-8 shadow-2xl h-full flex flex-col">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-semibold flex items-center gap-3">
                            <svg class="w-6 h-6 text-brand-purple" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                            Live Activity Feed
                        </h2>
                        <span class="px-3 py-1 bg-brand-500/10 text-brand-400 text-xs font-bold rounded-full border border-brand-500/20">Auto-syncing</span>
                    </div>
                    
                    <!-- Dynamic Task List -->
                    <div id="taskList" class="flex-grow space-y-4 overflow-y-auto pr-2">
                        <!-- Empty state by default, populated by JS -->
                        <div class="flex flex-col items-center justify-center h-40 text-slate-500 space-y-3">
                            <svg class="w-12 h-12 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                            <p>No active workflows. Deploy an agent to begin.</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
